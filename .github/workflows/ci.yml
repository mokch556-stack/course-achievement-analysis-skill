name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qa:
    name: 包质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run QA checks
        run: python scripts/qa_checks.py
